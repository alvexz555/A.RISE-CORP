<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0c">
  <meta name="description" content="Projetos em desenvolvimento da A.RISE.">
  <title>Projetos | A.RISE</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b0b0c;
      --surface: #111113;
      --text: #f5f5f5;
      --muted: #a5a5aa;
      --accent: #ed4545;
      --border: #29292c;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .back {
      display: inline-block;
      margin-bottom: 56px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .back:hover { color: var(--accent); }

    .eyebrow {
      color: var(--accent);
      font: 11px "Courier New", monospace;
      letter-spacing: 1.6px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(38px, 8vw, 58px);
      letter-spacing: -2px;
    }

    .intro {
      margin: 0 0 36px;
      color: var(--muted);
      line-height: 1.7;
    }

    .project {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: border-color 180ms ease, transform 180ms ease;
    }

    .project:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .project h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .project p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .arrow {
      color: var(--accent);
      font-size: 22px;
    }

    .status {
      display: inline-block;
      margin-top: 16px;
      color: #e8a3a3;
      font: 10px "Courier New", monospace;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      body { padding: 24px 18px; }
      .back { margin-bottom: 42px; }
      .project { padding: 19px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="../">← VOLTAR PARA A.RISE</a>

    <p class="eyebrow">ECOSSISTEMA A.RISE</p>
    <h1>Projetos<span style="color: var(--accent)">.</span></h1>
    <p class="intro">Experimentos, ferramentas e mundos em construção.</p>

    <a class="project" href="./hitbox-lab/">
      <div>
        <h2>HITBOX LAB</h2>
        <p>Laboratório interativo para testar colisões e entender hitboxes.</p>
        <span class="status">EM DESENVOLVIMENTO</span>
      </div>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>
  </main>
</body>
</html>
